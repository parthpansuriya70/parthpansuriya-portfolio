<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found | Parth Pansuriya</title>
  <meta name="description" content="The page you are looking for does not exist.">
  <meta name="robots" content="noindex, follow">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="/assets/Parth_Pansuriya_Favicon.png" type="image/png">
  <link rel="preload" href="/assets/fonts/space-grotesk-latin-wght.woff2" as="font" type="font/woff2" crossorigin>

  <style>
    @font-face {
      font-family: "Space Grotesk";
      src: url("/assets/fonts/space-grotesk-latin-wght.woff2") format("woff2");
      font-weight: 300 700;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: "Inter";
      src: url("/assets/fonts/inter-latin-wght.woff2") format("woff2");
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: "JetBrains Mono";
      src: url("/assets/fonts/jetbrains-mono-latin-wght.woff2") format("woff2");
      font-weight: 100 800;
      font-style: normal;
      font-display: swap;
    }
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --heading: #172a45;
      --text: #4f5c6d;
      --primary: #0f4cff;
      --primary-hover: #0a38d6;
      --primary-text: #ffffff;
      --border: #dfe4ee;
      --focus: #0f4cff;
      --radius: 6px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0e1a2e;
        --heading: #f2f4f8;
        --text: #b7c1d1;
        --primary: #5b8cff;
        --primary-hover: #86a9ff;
        --primary-text: #0e1a2e;
        --border: #28385a;
        --focus: #8fb0ff;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-content: center;
      padding: 2rem 1.25rem;
      background: var(--bg);
      color: var(--text);
      font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }
    main {
      max-width: 36rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
    }
    .code {
      margin: 0 0 1.25rem;
      font-family: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--primary);
    }
    h1 {
      margin: 0 0 1rem;
      font-family: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
      font-size: clamp(2.5rem, 1.4rem + 5vw, 4.5rem);
      font-weight: 600;
      letter-spacing: -0.045em;
      line-height: 1.04;
      color: var(--heading);
      text-wrap: balance;
    }
    h1 span { color: var(--primary); }
    p { margin: 0 0 2rem; font-size: 1.125rem; }
    .btn {
      display: inline-block;
      padding: 0.8rem 1.5rem;
      border-radius: var(--radius);
      background: var(--primary);
      color: var(--primary-text);
      font-weight: 600;
      text-decoration: none;
      transition: background-color 0.2s ease;
    }
    .btn:hover { background: var(--primary-hover); }
    .btn:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <p class="code">Error 404</p>
    <h1>That page is <span>not here</span>.</h1>
    <p>The link may be out of date or mistyped. The portfolio home page has everything.</p>
    <a class="btn" href="/">Back to the portfolio</a>
  </main>
</body>
</html>
